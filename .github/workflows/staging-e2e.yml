name: Staging E2E

on:
  workflow_dispatch:
    inputs:
      stripe_scenario:
        description: Stripe Billing scenario
        required: true
        default: all
        type: choice
        options:
          - all
          - 3ds

permissions:
  contents: read

concurrency:
  group: poeruum-staging-e2e
  cancel-in-progress: false

jobs:
  staging:
    name: Supabase and Stripe E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      STRIPE_MODE: test
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_FIXED_PLAN_PRICE_ID: ${{ secrets.STRIPE_FIXED_PLAN_PRICE_ID }}
      STRIPE_FIXED_PLAN_TAX_RATE_ID: ${{ secrets.STRIPE_FIXED_PLAN_TAX_RATE_ID }}
      STRIPE_E2E_APP_URL: http://127.0.0.1:5173
      APP_URL: http://127.0.0.1:5173
      STRIPE_E2E_SCENARIO: ${{ inputs.stripe_scenario }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reject production or incomplete credentials
        shell: bash
        run: |
          required=(
            SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD
            VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
            STRIPE_FIXED_PLAN_PRICE_ID STRIPE_FIXED_PLAN_TAX_RATE_ID
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Staging secret $name is missing."
              exit 1
            fi
          done
          if [ "$SUPABASE_PROJECT_REF" = "foctericixquaogwboqg" ]; then
            echo "::error::Production Supabase project is forbidden in Staging E2E."
            exit 1
          fi
          if [[ "$STRIPE_SECRET_KEY" != sk_test_* ]]; then
            echo "::error::Staging E2E accepts only a Stripe test key."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_URL" != "https://${SUPABASE_PROJECT_REF}.supabase.co" ]]; then
            echo "::error::Staging URL and project ref do not match."
            exit 1
          fi

      - name: Link staging Supabase
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply staging migrations
        run: npx supabase db push --linked

      - name: Configure staging Edge secrets
        run: |
          npx supabase secrets set \
            STRIPE_MODE="$STRIPE_MODE" \
            STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            STRIPE_FIXED_PLAN_PRICE_ID="$STRIPE_FIXED_PLAN_PRICE_ID" \
            STRIPE_FIXED_PLAN_TAX_RATE_ID="$STRIPE_FIXED_PLAN_TAX_RATE_ID" \
            APP_URL="$APP_URL" \
            POERUUM_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY" \
            POERUUM_SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy staging Edge Functions
        run: |
          npx supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy stripe-billing-checkout --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy stripe-billing-cancel --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy stripe-store-checkout --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy stripe-reservation-reaper --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"

      - name: Lint staging database
        run: npx supabase db lint --linked --schema public,extensions --level warning --fail-on warning

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start staging frontend
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/poeruum-vite.log 2>&1 &
          echo "$!" > /tmp/poeruum-vite.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/poeruum-vite.log
          exit 1

      - name: Reservation and fee cap E2E
        run: npm run test:reservation-cap

      - name: Account deletion E2E
        run: npm run test:account-deletion

      - name: Stripe Billing browser E2E
        run: npm run test:stripe-billing

      - name: Upload frontend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-vite-log
          path: /tmp/poeruum-vite.log
          if-no-files-found: ignore
          retention-days: 7
