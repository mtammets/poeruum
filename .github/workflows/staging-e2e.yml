name: Ephemeral Staging E2E

on:
  workflow_dispatch:
    inputs:
      stripe_scenario:
        description: Stripe Billing scenario
        required: true
        default: all
        type: choice
        options:
          - all
          - 3ds

permissions:
  contents: read

concurrency:
  group: poeruum-ephemeral-staging-e2e
  cancel-in-progress: false

jobs:
  staging:
    name: Temporary Supabase and Stripe E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORGANIZATION_ID: chotrrarsdhcqhvloulo
      STRIPE_MODE: test
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      STRIPE_E2E_APP_URL: http://127.0.0.1:5173
      APP_URL: http://127.0.0.1:5173
      STRIPE_E2E_SCENARIO: ${{ inputs.stripe_scenario }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reject incomplete or live credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Staging secret SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi
          if [[ "$STRIPE_SECRET_KEY" != sk_test_* ]]; then
            echo "::error::Ephemeral E2E accepts only a Stripe sk_test_ key."
            exit 1
          fi
          if [[ "$RESEND_API_KEY" != re_* ]]; then
            echo "::error::Staging secret RESEND_API_KEY is missing or invalid."
            exit 1
          fi

      - name: Remove abandoned E2E projects
        run: node scripts/manage-ephemeral-supabase.mjs cleanup

      - name: Create temporary Supabase project
        run: node scripts/manage-ephemeral-supabase.mjs create

      - name: Create temporary Stripe configuration
        run: node scripts/manage-stripe-e2e-resources.mjs create

      - name: Link temporary Supabase
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply every migration
        run: npx supabase db push --linked

      - name: Configure temporary Edge secrets
        shell: bash
        run: |
          RATE_LIMIT_SALT="$(openssl rand -hex 32)"
          ONBOARDING_CRON_SECRET="$(openssl rand -hex 32)"
          RESEND_WEBHOOK_SECRET="whsec_$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$RESEND_WEBHOOK_SECRET"
          echo "RESEND_WEBHOOK_SECRET=$RESEND_WEBHOOK_SECRET" >> "$GITHUB_ENV"
          npx supabase secrets set \
            STRIPE_MODE="$STRIPE_MODE" \
            STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            STRIPE_FIXED_PLAN_PRICE_ID="$STRIPE_FIXED_PLAN_PRICE_ID" \
            STRIPE_FIXED_PLAN_TAX_RATE_ID="$STRIPE_FIXED_PLAN_TAX_RATE_ID" \
            APP_URL="$APP_URL" \
            POERUUM_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY" \
            POERUUM_SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY" \
            RATE_LIMIT_SALT="$RATE_LIMIT_SALT" \
            ONBOARDING_CRON_SECRET="$ONBOARDING_CRON_SECRET" \
            RESEND_API_KEY="$RESEND_API_KEY" \
            RESEND_WEBHOOK_SECRET="$RESEND_WEBHOOK_SECRET" \
            RESEND_FROM_EMAIL="Poeruum <teavitused@send.poeruum.ee>" \
            SUPPORT_PUBLIC_EMAIL="info@poeruum.ee" \
            SUPPORT_REPLY_TO="info@poeruum.ee" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy temporary Edge Functions
        run: |
          npx supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy stripe-billing-checkout --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy stripe-billing-cancel --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy stripe-store-checkout --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy stripe-reservation-reaper --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy support-actions --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy resend-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Lint temporary database
        run: npx supabase db lint --linked --schema public,extensions --level warning --fail-on warning

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start temporary frontend
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/poeruum-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/poeruum-vite.log
          exit 1

      - name: Reservation and fee cap E2E
        run: npm run test:reservation-cap

      - name: Stripe store settlement E2E
        run: npm run test:stripe-settlement

      - name: Account deletion E2E
        run: npm run test:account-deletion

      - name: Stripe Billing browser E2E
        run: npm run test:stripe-billing

      - name: Support actions E2E
        run: npm run supabase:support:test-actions

      - name: Resend webhook signature and delivery-state E2E
        run: npm run supabase:support:test-webhook:staging

      - name: Upload frontend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ephemeral-staging-vite-log
          path: /tmp/poeruum-vite.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary Stripe configuration
        if: always()
        run: node scripts/manage-stripe-e2e-resources.mjs delete

      - name: Delete temporary Supabase project
        if: always()
        run: node scripts/manage-ephemeral-supabase.mjs delete
