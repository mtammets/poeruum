name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Lint, test, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check Edge Functions
        run: npm run check:edge

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build:app

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations and database lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Start isolated Supabase database
        run: npx supabase db start

      - name: Apply every migration from zero
        run: npx supabase db reset --local --no-seed

      - name: Test data retention boundaries
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-data-retention.sql

      - name: Test first rate-limit request
        shell: bash
        run: |
          if ! output="$(psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-rate-limit-first.sql 2>&1)"; then
            output="${output//'%'/'%25'}"
            output="${output//$'\n'/'%0A'}"
            output="${output//$'\r'/'%0D'}"
            echo "::error file=supabase/migrations/202607250005_security_observability.sql::$output"
            exit 1
          fi

      - name: Test atomic rate-limit increment
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-rate-limit-second.sql

      - name: Test rate-limit rejection
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-rate-limit-rejection.sql

      - name: Test error monitoring
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-monitoring.sql

      - name: Lint database schemas
        run: npx supabase db lint --local --schema public,extensions --level warning --fail-on warning

      - name: Stop isolated Supabase database
        if: always()
        run: npx supabase stop --no-backup
