name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Lint, test, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint
        run: npm run lint

      - name: Type-check Edge Functions
        run: deno check --node-modules-dir=auto --minimum-dependency-age=0 supabase/functions/*/index.ts

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build:app

      - name: Enforce Lighthouse performance and accessibility budgets
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/poeruum-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused --silent http://127.0.0.1:4173/ > /dev/null
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ \
            --only-categories=performance,accessibility \
            --output=json \
            --output-path=/tmp/poeruum-lighthouse.json \
            --chrome-flags="--headless --no-sandbox" \
            --quiet
          npm run lighthouse:assert -- /tmp/poeruum-lighthouse.json

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations and database lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Start isolated Supabase database
        run: npx supabase db start

      - name: Apply every migration from zero
        run: npx supabase db reset --local --no-seed

      - name: Test data retention boundaries
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-data-retention.sql

      - name: Test first rate-limit request
        shell: bash
        run: |
          if ! output="$(psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-rate-limit-first.sql 2>&1)"; then
            output="${output//'%'/'%25'}"
            output="${output//$'\n'/'%0A'}"
            output="${output//$'\r'/'%0D'}"
            echo "::error file=supabase/migrations/202607250005_security_observability.sql::$output"
            exit 1
          fi

      - name: Test atomic rate-limit increment
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-rate-limit-second.sql

      - name: Test rate-limit rejection
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-rate-limit-rejection.sql

      - name: Test error monitoring
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-monitoring.sql

      - name: Lint database schemas
        run: npx supabase db lint --local --schema public,extensions --level warning --fail-on warning

      - name: Stop isolated Supabase database
        if: always()
        run: npx supabase stop --no-backup
