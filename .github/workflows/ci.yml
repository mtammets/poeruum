name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      browser: ${{ steps.plan.outputs.browser }}
      server: ${{ steps.plan.outputs.server }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test scope selection and deployment gate
        run: node --test scripts/test-ci-scope.mjs

      - name: Select checks from the complete change
        id: plan
        run: node scripts/ci-scope.mjs plan

  application:
    name: Lint, test, build and audit
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check Edge Functions
        if: needs.scope.outputs.mode == 'full'
        run: npm run check:edge

      - name: Admin push authorization, encryption and delivery
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:admin-push-edge

      - name: Support deletion authorization and attachment cleanup
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:support-delete-edge

      - name: Admin support conversation creation and email retries
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:support-create-edge

      - name: Admin payment diagnostics authorization and read-only Stripe access
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:admin-payment-status-edge

      - name: Seller changes authorization and Stripe verification
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:seller-settings-edge
      - name: Check payout session permissions
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:stripe-payouts-edge
      - name: Withdrawal API and confirmation queue
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:withdrawal-edge

      - name: Unit tests
        run: npm run test

      - name: Order email Edge authentication and retry test
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:order-email-edge

      - name: Order receipt Edge authorization and checkout test
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:order-receipt-edge

      - name: Campaign copy Edge authorization and limits
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:campaign-copy-edge

      - name: Merchant story invitations, interviews and publication
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:story-interview-edge

      - name: Signed payment event crash recovery
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:payment-recovery-edge

      - name: Private invoices, PDF rendering and delivery recovery
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:order-invoice-edge

      - name: Platform fee invoices and subscription VAT accounting
        if: needs.scope.outputs.mode == 'full'
        run: |
          npm run test:platform-invoices-edge
          npm run test:subscription-invoices-edge

      - name: Merchant email activation enforcement
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:account-email-edge

      - name: External refund and dispute webhooks
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:payment-safeguards-edge

      - name: Production build
        run: npm run build:app

      - name: Merchant story public routing and SEO
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:story-server

      - name: Production receipt routing
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:order-receipt-server

      - name: Production directory highlights
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:directory-highlights-server

      - name: Horoscope sharing previews and images
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:horoscope-server

      - name: Closed storefront routing and content isolation
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:closed-storefront-server

      - name: Production campaign routing and assets
        if: needs.scope.outputs.mode == 'full'
        run: npm run test:campaign-server

      - name: Push service worker and production assets
        if: needs.scope.outputs.mode == 'full'
        run: node scripts/test-admin-push-worker.mjs

      - name: Related server rendering checks
        if: needs.scope.outputs.mode == 'ui'
        env:
          CI_SERVER_TESTS: ${{ needs.scope.outputs.server }}
        run: node scripts/ci-scope.mjs server

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser tests (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards || '[1]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run selected browser checks
        env:
          CI_MODE: ${{ needs.scope.outputs.mode }}
          CI_BROWSER_TESTS: ${{ needs.scope.outputs.browser }}
          CI_SHARD: ${{ matrix.shard }}
        run: node scripts/ci-scope.mjs browser

  journeys:
    name: Seller and payment journeys
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Seller setup, Stripe return and first product journey
        run: npm run test:seller-preview -- --workers=1

      - name: Payment preview navigation and Stripe return
        run: npm run test:payment-preview -- --workers=1

  database:
    name: Migrations and database lint
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Start isolated Supabase database
        run: npx supabase db start

      - name: Apply every migration from zero
        run: npx supabase db reset --local --no-seed

      - name: Test data retention boundaries
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-data-retention.sql

      - name: Test merchant email policy and unused registration cleanup
        run: npm run test:account-email-db

      - name: Test protected store publication
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-store-publication.sql

      - name: Test one store per owner and concurrent creation
        run: node scripts/test-store-ownership.mjs

      - name: Test seller settings guards and atomic verification
        run: npm run test:seller-settings
      - name: Withdrawal permissions and durable declarations
        run: npm run test:withdrawals

      - name: Test entrepreneur sellers, payment permissions and sale documents
        run: npm run test:entrepreneur-sellers

      - name: Test platform VAT registration, fee invoices and credit notes
        run: npm run test:platform-billing-db

      - name: Test product image access boundaries
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-product-image-access.sql

      - name: Test admin product previews, pagination and access boundaries
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-admin-store-products.sql

      - name: Test newest-first product ordering across storefront and directory
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-product-order.sql

      - name: Test product category access boundaries
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-product-categories.sql

      - name: Test admin directory ordering and access boundaries
        run: psql postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres --file scripts/test-store-directory-order.sql

      - name: Test directory campaign scheduling and admin permissions
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-directory-campaign.sql

      - name: Test homepage shop selection and admin access boundaries
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-homepage-showcase.sql

      - name: Test merchant directory descriptions and SEO isolation
        run: psql postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres --file scripts/test-store-directory-description.sql

      - name: Test merchant directory visibility and independent store publication
        run: psql postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres --file scripts/test-store-directory-visibility.sql

      - name: Test closed storefront branding and private content isolation
        run: psql postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres --file scripts/test-closed-storefront.sql

      - name: Test directory analytics aggregation and access boundaries
        run: psql postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres --file scripts/test-directory-analytics.sql

      - name: Test merchant analytics aggregation and store isolation
        run: psql postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres --file scripts/test-store-analytics.sql

      - name: Test private business card drafts and concurrent saves
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-business-card-drafts.sql

      - name: Test private campaign versions and admin access
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-admin-campaigns.sql

      - name: Test abandoned draft cleanup boundaries
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-abandoned-draft-cleanup.sql

      - name: Test Stripe requirement notification boundaries
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-stripe-requirement-notifications.sql

      - name: Test admin push queue, leases and access revocation
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-admin-push.sql

      - name: Test first rate-limit request
        shell: bash
        run: |
          if ! output="$(psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-rate-limit-first.sql 2>&1)"; then
            output="${output//'%'/'%25'}"
            output="${output//$'\n'/'%0A'}"
            output="${output//$'\r'/'%0D'}"
            echo "::error file=supabase/migrations/202607250005_security_observability.sql::$output"
            exit 1
          fi

      - name: Test atomic rate-limit increment
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-rate-limit-second.sql

      - name: Test rate-limit rejection
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-rate-limit-rejection.sql

      - name: Test error monitoring
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-monitoring.sql

      - name: Test atomic admin support creation, permissions and retry isolation
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 --file scripts/test-support-create.sql

      - name: Test payment confirmation before settlement and after refunds
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-paid-order-completion.sql

      - name: Test payment reviews and private seller verification
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-payment-safeguards.sql

      - name: Test durable settlements, leases and refunds
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-order-settlements.sql

      - name: Test independent order email jobs and delivery events
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-order-emails.sql

      - name: Test immutable invoices, numbering, credit notes and retention
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-order-invoices.sql

      - name: Test concurrent invoice numbering
        run: node scripts/test-order-invoice-concurrency.mjs

      - name: Test historical email migration and scheduling
        run: node scripts/test-order-email-migration.mjs

      - name: Test email application isolation and historical attribution
        run: node scripts/test-email-source-isolation-migration.mjs

      - name: Test private order receipt credentials and confirmation
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-order-receipts.sql

      - name: Test payment recovery, immutable attempts and stale workers
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --file scripts/test-payment-recovery.sql

      - name: Test historical payment recovery and cron replacement
        run: node scripts/test-payment-recovery-migration.mjs

      - name: Test order phone recovery, persistence and deletion
        run: node scripts/test-order-customer-phone.mjs

      - name: Test merchant story privacy, publication and retention
        run: psql postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres --file scripts/test-story-interviews.sql

      - name: Lint database schemas
        run: npx supabase db lint --local --schema public,extensions --level warning --fail-on warning

      - name: Stop isolated Supabase database
        if: always()
        run: npx supabase stop --no-backup

  ready:
    name: CI ready
    if: always()
    needs: [scope, application, browser, journeys, database]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs gate
