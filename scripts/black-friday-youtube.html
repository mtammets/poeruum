<!doctype html>
<meta charset="utf-8">
<title>Musta rähni päevad · YouTube</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f0eadc; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
<canvas width="1920" height="1080"></canvas>
<script>
  const W = 1920, H = 1080, DURATION = 15;
  const paper = '#f0eadc', ink = '#531b25';
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const beak = new Path2D('M 39 468 L 265 488 L 272 506 L 247 520 L 209 519 L 147 506 L 83 487 Z');
  const body = new Path2D('M 0 0 H 1448 V 1086 H 0 Z M 39 468 L 265 488 L 272 506 L 247 520 L 209 519 L 147 506 L 83 487 Z');
  const mouth = new Path2D('M 208 484 L 272 486 L 274 529 L 239 524 Z');
  const loadImage = async (src) => { const img = new Image(); img.src = src; await img.decode(); return img; };
  let bird, forest, distantForest;
  const callTimes = [3.8, 10.7];
  const TAU = Math.PI * 2;

  function forestLayer(t, width, y, opacity, phase, softenBottom = true) {
    const height = width / 3;
    const travel = ((t / DURATION + phase) % 1) * width * 2;
    ctx.save();
    ctx.globalAlpha = opacity;
    for (let index = -3; index <= 2; index++) {
      const x = travel + index * width;
      ctx.save();
      ctx.translate(x + (index % 2 ? width : 0), y);
      ctx.scale(index % 2 ? -1 : 1, 1);
      ctx.drawImage(softenBottom ? distantForest : forest, 0, 0, width, height);
      ctx.restore();
    }
    ctx.restore();
  }

  function word(text, weight, italic, y, width) {
    ctx.save();
    let size = 250;
    const setFont = () => { ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px "Bodoni Film"`; };
    setFont();
    size *= width / ctx.measureText(text).width;
    setFont();
    const m = ctx.measureText(text);
    const x = 146;
    const baseline = y + m.actualBoundingBoxAscent;
    ctx.fillStyle = ink;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1.7;
    ctx.lineJoin = 'round';
    ctx.strokeText(text, x, baseline);
    ctx.fillText(text, x, baseline);
    ctx.restore();
    return { text, x, y, width: m.width, height: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent };
  }

  window.renderFrame = (seconds) => {
    const t = ((seconds % DURATION) + DURATION) % DURATION;
    const p = t / DURATION * TAU;
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, W, H);
    const light = ctx.createRadialGradient(1740, 200, 10, 1300, 350, 1400);
    light.addColorStop(0, '#fff9ed'); light.addColorStop(.6, '#f0eadc'); light.addColorStop(1, '#ece5d6');
    ctx.fillStyle = light; ctx.fillRect(0, 0, W, H);
    const ground = ctx.createLinearGradient(0, 570, 0, H);
    ground.addColorStop(0, '#77725400'); ground.addColorStop(.55, '#77725420'); ground.addColorStop(1, '#77725480');
    ctx.fillStyle = ground; ctx.fillRect(0, 0, W, H);
    forestLayer(t, 1600, 410, .28, .16);
    forestLayer(t, 2000, 530, .48, .58);
    forestLayer(t, 2400, 630, .75, .32, false);
    const mist = ctx.createLinearGradient(0, 0, 1180, 0);
    mist.addColorStop(0, '#f0eadc90'); mist.addColorStop(.65, '#f0eadc80'); mist.addColorStop(1, '#f0eadc00');
    ctx.fillStyle = mist; ctx.fillRect(0, 0, W, H);

    const first = word('MUSTA', 500, true, 210, 604);
    const second = word('RÄHNI', 600, false, first.y + first.height + 32, 658);
    const third = word('PÄEVAD', 500, true, second.y + second.height + 32, 650);
    const typography = [first, second, third];

    // Same periodic flight as the Reel, with independent landscape framing.
    const depth = (1 - Math.cos(p)) / 2;
    const width = 1035 + 115 * depth;
    const scale = width / 1448;
    const x = 850 - 45 * depth + 15 * Math.sin(p);
    const y = 100 + 23 * Math.sin(p - .5) + 12 * depth;
    const rotation = (2.8 * Math.cos(p) - 1.3) * Math.PI / 180;
    const call = callTimes.find(start => t >= start && t < start + 1.3);
    const calling = call !== undefined;
    const callProgress = calling ? (t - call) / 1.3 : 0;
    const open = calling ? Math.pow(Math.max(0, Math.sin(callProgress * TAU * 6)), .7) : 0;
    ctx.save();
    ctx.translate(x + width * .58, y + width * .75 * .45);
    ctx.rotate(rotation);
    ctx.scale(scale, scale);
    ctx.translate(-1448 * .58, -1086 * .45);
    ctx.save();
    ctx.filter = 'drop-shadow(0px 18px 18px #44312025)';
    if (calling) { ctx.fillStyle = '#201818'; ctx.fill(mouth); ctx.clip(body, 'evenodd'); }
    ctx.drawImage(bird, 0, 0, 1448, 1086);
    ctx.restore();
    if (calling) {
      ctx.save();
      ctx.translate(265, 490); ctx.rotate(-open * 16 * Math.PI / 180); ctx.translate(-265, -490);
      ctx.clip(beak); ctx.drawImage(bird, 0, 0, 1448, 1086); ctx.restore();
    }
    ctx.restore();
    return { typography, bird: { x, y, width, rotation }, calling };
  };

  window.ready = (async () => {
    const fonts = [
      new FontFace('Bodoni Film', 'url(/public/fonts/bodoni-moda/BodoniModa-Italic.ttf)', { style: 'italic', weight: '500' }),
      new FontFace('Bodoni Film', 'url(/public/fonts/bodoni-moda/BodoniModa-Semibold.ttf)', { style: 'normal', weight: '600' }),
    ];
    await Promise.all(fonts.map(async font => document.fonts.add(await font.load())));
    [bird, forest] = await Promise.all([
      loadImage('/public/images/campaigns/musta-rahni-cutout-v2.webp'),
      loadImage('/public/images/campaigns/musta-rahni-forest-v1.webp'),
    ]);
    distantForest = document.createElement('canvas');
    distantForest.width = forest.width; distantForest.height = forest.height;
    const f = distantForest.getContext('2d');
    f.drawImage(forest, 0, 0);
    f.globalCompositeOperation = 'destination-in';
    const fade = f.createLinearGradient(0, forest.height * .55, 0, forest.height);
    fade.addColorStop(0, '#000'); fade.addColorStop(1, '#0000');
    f.fillStyle = fade; f.fillRect(0, 0, forest.width, forest.height);
    return window.renderFrame(0);
  })();
</script>
